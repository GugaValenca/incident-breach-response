# This [project] table exists only so Vercel's build (which runs `uv lock`
# the moment any pyproject.toml is present, regardless of why it's there)
# has a valid PEP 621 project to resolve. requirements.txt stays the
# source of truth for local dev and any pip-based host - keep this list
# in sync with it by hand; there are few enough dependencies that a
# drift here would show up immediately as a build failure, not silently.
[project]
name = "incident-breach-response"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<7.0",
    "reportlab>=4.0",
    "django-ratelimit>=4.1",
    "dj-database-url>=2.1",
    "psycopg[binary]>=3.1",
    "whitenoise>=6.6",
]

[tool.black]
line-length = 96
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 96

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
# Same selection as Projects 2 and 3: ruff's defaults minus E501 (black
# owns line length, and seed data/help_text read better unwrapped), plus
# import sorting, comprehension cleanups, timezone-naive datetime checks
# (DTZ matters more than usual here: every deadline is computed from a
# timestamp) and ruff's own rules.
select = ["E4", "E7", "E9", "F", "I", "C4", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `app` is the module-level name Vercel's Python runtime looks for as the
# WSGI entrypoint - it's not unused, ruff just can't see that caller.
"api/index.py" = ["F401"]
# Auto-generated by `manage.py makemigrations` - never hand-edited.
"incidents/migrations/*.py" = ["RUF012"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"

[[tool.mypy.overrides]]
# Ship no py.typed marker / stubs; not this project's code to fix.
module = ["django_ratelimit.*", "reportlab.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["incidents"]
omit = ["incidents/migrations/*", "incidents/tests.py"]
